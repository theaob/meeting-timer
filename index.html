<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-phase="idle">
  <main class="app">
    <header class="bar">
      <h1>Meeting Timer</h1>
      <div class="bar-actions">
        <button id="mute" class="icon" type="button" aria-pressed="false" title="Mute sounds (M)">🔊</button>
        <button id="fullscreen" class="icon" type="button" title="Full screen (F)">⛶</button>
      </div>
    </header>

    <section class="clock" aria-live="off">
      <div id="label" class="label">Ready</div>
      <div id="time" class="time">15:00</div>
      <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
      <div id="meeting-line" class="meeting-line"></div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <ol id="queue" class="queue" aria-label="Speakers"></ol>
    </section>

    <section class="controls">
      <button id="start" class="primary" type="button">Start</button>
      <button id="next" type="button" title="Next speaker (N)" hidden>Next speaker</button>
      <button id="plus" type="button" title="Add one minute">+1 min</button>
      <button id="reset" type="button" title="Reset (R)">Reset</button>
    </section>

    <section class="setup" id="setup">
      <div class="presets" role="group" aria-label="Meeting length">
        <button type="button" class="preset" data-minutes="15" data-name="Daily standup" data-wrapup="2" data-speakers="true">Daily · 15</button>
        <button type="button" class="preset" data-minutes="30" data-name="Meeting" data-wrapup="5" data-speakers="false">30 min</button>
        <button type="button" class="preset" data-minutes="45" data-name="Meeting" data-wrapup="5" data-speakers="false">45 min</button>
        <button type="button" class="preset" data-minutes="60" data-name="Meeting" data-wrapup="5" data-speakers="false">60 min</button>
      </div>

      <div class="fields">
        <label>Length (minutes)
          <input id="minutes" type="number" min="1" max="600" step="1" value="15" inputmode="numeric">
        </label>
        <label>"Wrapping up" at (minutes left)
          <input id="wrapup" type="number" min="0" max="60" step="0.5" value="2" inputmode="decimal">
        </label>
        <label>Other reminders (minutes left)
          <input id="reminders" type="text" value="5, 1" placeholder="5, 1" inputmode="decimal">
        </label>
      </div>

      <div class="speakers">
        <label class="check">
          <input id="use-speakers" type="checkbox" checked>
          Time each person
        </label>
        <div id="speaker-fields" class="fields">
          <label>People
            <input id="people" type="number" min="1" max="50" step="1" value="5" inputmode="numeric">
          </label>
          <label>Per person (minutes)
            <input id="per-speaker" type="number" min="0.25" max="60" step="0.25" placeholder="auto" inputmode="decimal">
          </label>
          <div id="per-speaker-hint" class="hint-inline"></div>
        </div>
      </div>

      <div class="fields">
        <label class="check">
          <input id="voice" type="checkbox" checked>
          Spoken announcements
        </label>
        <label class="check">
          <input id="overtime-beep" type="checkbox" checked>
          Beep every minute in overtime
        </label>
        <button id="test-sound" type="button" class="link">Test sound</button>
      </div>
    </section>

    <footer class="hint">Space start/pause · N next speaker · R reset · F full screen · M mute</footer>
  </main>

  <script src="timer-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
